[package]
name = "ghostline"
version = "0.1.0"
description = "Teleprompter overlay that follows your voice and stays invisible to screen sharing."
authors = ["Ghostline contributors"]
license = "MIT"
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "ghostline_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-log = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-dialog = "2"
cpal = "0.16"
vosk = "0.3.1"
ureq = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }
sha2 = "0.11"
notify-debouncer-mini = "0.7"

[dev-dependencies]
hound = "3"
tempfile = "3"

