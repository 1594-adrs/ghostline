name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # Tauri's build embeds dist/, so the frontend must exist before any cargo step.
      - run: npx ng build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm run fetch:vosk
      # Test binaries load libvosk.dll at runtime.
      - run: echo "$GITHUB_WORKSPACE/src-tauri/vendor/vosk" >> "$GITHUB_PATH"

      - working-directory: src-tauri
        run: cargo fmt --check
      - working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - working-directory: src-tauri
        run: cargo test
