name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # Tauri's build embeds dist/, so the frontend must exist before any cargo step.
      - run: npx ng build

      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: src-tauri

      - run: npm run fetch:vosk
      # Test binaries load libvosk.dll at runtime.
      - run: echo "$GITHUB_WORKSPACE/src-tauri/vendor/vosk" >> "$GITHUB_PATH"

      - working-directory: src-tauri
        run: cargo fmt --check
      - working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - working-directory: src-tauri
        run: cargo test
